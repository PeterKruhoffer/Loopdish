name: LoopDish
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift.git
    exactVersion: 0.8.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    # ConvexMobile 0.8.1 ships an arm64-only iOS simulator binary.
    'EXCLUDED_ARCHS[sdk=iphonesimulator*]': x86_64
targets:
  LoopDish:
    type: application
    platform: iOS
    sources: [LoopDish]
    dependencies:
      - package: ConvexMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopdish.ios
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '3'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: LoopDish
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes: [loopdish]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  LoopDishTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LoopDishTests]
    dependencies:
      - target: LoopDish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopdish.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  LoopDishUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LoopDishUITests]
    dependencies:
      - target: LoopDish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopdish.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LoopDish:
    build:
      targets:
        LoopDish: all
    test:
      targets: [LoopDishTests, LoopDishUITests]
