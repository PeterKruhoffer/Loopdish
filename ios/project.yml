name: LoopDish
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift.git
    exactVersion: 0.8.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    # ConvexMobile 0.8.1 ships an arm64-only iOS simulator binary.
    'EXCLUDED_ARCHS[sdk=iphonesimulator*]': x86_64
targets:
  LoopDish:
    type: application
    platform: iOS
    sources: [LoopDish, Shared]
    entitlements:
      path: Generated/LoopDish.entitlements
      properties:
        com.apple.security.application-groups: [group.com.loopdish.ios]
    dependencies:
      - package: ConvexMobile
      - target: DinnerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopdish.ios
        DEVELOPMENT_TEAM: 94985YFAN4
        CODE_SIGN_IDENTITY: iPhone Developer
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '6'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: LoopDish
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes: [loopdish]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  DinnerWidget:
    type: app-extension
    platform: iOS
    sources:
      - DinnerWidget
      - Shared
      - LoopDish/Models.swift
    entitlements:
      path: Generated/DinnerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.loopdish.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopdish.ios.dinner-widget
        DEVELOPMENT_TEAM: 94985YFAN4
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '6'
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/DinnerWidget-Info.plist
      properties:
        CFBundleDisplayName: LoopDish Dinner
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LoopDishTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LoopDishTests]
    dependencies:
      - target: LoopDish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopdish.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  LoopDishUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LoopDishUITests]
    dependencies:
      - target: LoopDish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopdish.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
  DinnerWidgetRenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DinnerWidgetRenderTests
      - DinnerWidget/DinnerWidgetView.swift
      - Shared
      - LoopDish/Models.swift
    dependencies:
      - target: LoopDish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopdish.ios.widget-render-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LoopDish:
    build:
      targets:
        LoopDish: all
    test:
      targets: [LoopDishTests, LoopDishUITests, DinnerWidgetRenderTests]
