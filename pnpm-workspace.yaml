minimumReleaseAge: 7200
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
strictDepBuilds: true
saveExact: true

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest@*: 4.1.11

peerDependencyRules:
  # Vite+ core intentionally reports the Vite+ release number, not Vite's.
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  # Convex uses esbuild's install script to verify its platform binary.
  esbuild: true
